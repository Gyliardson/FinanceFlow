name: Replace pgcrypto one shot

on:
  push:
    branches:
      - work/29-durable-financial-idempotency
    paths:
      - .github/workflows/replace-pgcrypto-one-shot.yml

permissions:
  contents: write

jobs:
  rewrite:
    if: github.repository == 'Gyliardson/FinanceFlow'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact work branch
        uses: actions/checkout@v6
        with:
          ref: work/29-durable-financial-idempotency
      - name: Replace extension hash with PostgreSQL 16 core SHA-256
        shell: python
        run: |
          from pathlib import Path

          migration = Path('backend/migrations/006_financial_idempotency.sql')
          text = migration.read_text(encoding='utf-8')
          old_extension = 'CREATE EXTENSION IF NOT EXISTS pgcrypto;\n\n'
          old_hash = "encode(digest(convert_to(p_payload::text, 'UTF8'), 'sha256'), 'hex')"
          new_hash = "encode(sha256(convert_to(p_payload::text, 'UTF8')), 'hex')"
          if text.count(old_extension) != 1 or text.count(old_hash) != 1:
              raise SystemExit('migration replacement precondition failed')
          migration.write_text(
              text.replace(old_extension, '').replace(old_hash, new_hash),
              encoding='utf-8',
          )

          probe = Path('backend/financial_idempotency_probe.sh')
          probe_text = probe.read_text(encoding='utf-8')
          probe_extension = 'CREATE EXTENSION IF NOT EXISTS pgcrypto;\n'
          if probe_text.count(probe_extension) != 1:
              raise SystemExit('probe replacement precondition failed')
          probe.write_text(probe_text.replace(probe_extension, ''), encoding='utf-8')
      - name: Commit only the two database contract files
        shell: bash
        run: |
          set -euo pipefail
          git add backend/migrations/006_financial_idempotency.sql backend/financial_idempotency_probe.sh
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(db): use PostgreSQL core SHA-256 for idempotency'
          git push origin HEAD:work/29-durable-financial-idempotency
