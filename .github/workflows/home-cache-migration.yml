name: HomeScreen owner-cache migration bootstrap

on:
  push:
    branches:
      - work/8-ownership-private-receipts

permissions:
  contents: write

jobs:
  migrate:
    if: contains(github.event.head_commit.message, '[home-cache-migrate]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: work/8-ownership-private-receipts
      - name: Replace screen-global financial cache with authenticated owner cache
        shell: python
        run: |
          from pathlib import Path

          path = Path('mobile/src/screens/HomeScreen.tsx')
          source = path.read_text()

          replacements = [
              (
                  "import AsyncStorage from '@react-native-async-storage/async-storage';\n",
                  "import { useAuth } from '../services/AuthContext';\nimport { getUserCache, setUserCache } from '../services/userCache';\n",
              ),
              (
                  "export default function HomeScreen({ navigation }: any) {\n  const [allBills, setAllBills] = useState<Bill[]>([]);",
                  "export default function HomeScreen({ navigation }: any) {\n  const { session } = useAuth();\n  const userId = session?.user.id;\n  const [allBills, setAllBills] = useState<Bill[]>([]);",
              ),
              (
                  "      await AsyncStorage.setItem('@bills_cache', JSON.stringify(response.data.data || []));",
                  "      if (userId) await setUserCache(userId, 'bills', response.data.data || []);",
              ),
              (
                  "      const cached = await AsyncStorage.getItem('@bills_cache');\n      if (cached) setAllBills(JSON.parse(cached));",
                  "      const cached = userId ? await getUserCache<Bill[]>(userId, 'bills') : null;\n      if (cached) setAllBills(cached);",
              ),
              (
                  "        await AsyncStorage.setItem('@settings_cache', JSON.stringify(s));",
                  "        if (userId) await setUserCache(userId, 'settings', s);",
              ),
              (
                  "      const cached = await AsyncStorage.getItem('@settings_cache');\n      if (cached) {\n        const s = JSON.parse(cached);",
                  "      const cached = userId ? await getUserCache<any>(userId, 'settings') : null;\n      if (cached) {\n        const s = cached;",
              ),
              (
                  "  }, []);",
                  "  }, [userId]);",
              ),
          ]

          for old, new in replacements:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one occurrence, found {count}: {old[:80]!r}')
              source = source.replace(old, new, 1)

          forbidden = ["AsyncStorage", "@bills_cache", "@settings_cache"]
          remaining = [token for token in forbidden if token in source]
          if remaining:
              raise SystemExit(f'Legacy global cache tokens remain in HomeScreen: {remaining}')

          path.write_text(source)
      - name: Commit migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mobile/src/screens/HomeScreen.tsx
          git diff --cached --check
          git diff --cached --exit-code && exit 0 || true
          git commit -m 'security(mobile): scope HomeScreen cache by authenticated user'
          git push origin HEAD:work/8-ownership-private-receipts
