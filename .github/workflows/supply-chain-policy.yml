name: Supply-chain policy

on:
  workflow_dispatch:
  pull_request:
    branches:
      - portfolio/revamp-2026
      - main
  push:
    branches:
      - portfolio/revamp-2026
      - 'work/**'

permissions:
  contents: read

jobs:
  action-pins:
    name: Immutable Actions and reproducible tooling
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup deterministic parser runtime
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          check-latest: false
      - name: Install hash-pinned semantic YAML parser
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-deps --only-binary=:all: --require-hashes -r .github/scripts/requirements-supply-chain.txt
          python - <<'PY'
          import sys
          import yaml
          print(f"SUPPLY_CHAIN_PYTHON={sys.version.split()[0]}")
          print(f"SUPPLY_CHAIN_PARSER_BOOTSTRAP=PyYAML {yaml.__version__}")
          if yaml.__version__ != "6.0.3":
              raise SystemExit("unexpected semantic parser version")
          PY
      - name: Verify workflow supply-chain policy
        run: python .github/scripts/check_supply_chain.py
      - name: Test the supply-chain policy
        run: python .github/scripts/test_supply_chain.py
