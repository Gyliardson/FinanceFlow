name: Authenticated data plane

on:
  pull_request:
    branches:
      - portfolio/revamp-2026
      - main
  push:
    branches:
      - portfolio/revamp-2026
      - 'work/**'

permissions:
  contents: read

jobs:
  postgres-data-plane:
    name: PostgreSQL authenticated write boundary
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: financeflow
          POSTGRES_PASSWORD: financeflow
          POSTGRES_DB: financeflow_data_plane_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U financeflow -d financeflow_data_plane_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: financeflow
      PGPASSWORD: financeflow
      PGDATABASE: financeflow_data_plane_test
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create Supabase-compatible financial fixture
        shell: bash
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE authenticated NOLOGIN;
          CREATE SCHEMA auth;
          CREATE TABLE auth.users (id uuid PRIMARY KEY);
          CREATE FUNCTION auth.uid() RETURNS uuid
          LANGUAGE sql STABLE
          AS $$ SELECT NULLIF(current_setting('request.jwt.claim.sub', true), '')::uuid $$;

          CREATE TABLE finance_bills (
              id uuid DEFAULT gen_random_uuid() PRIMARY KEY,
              description text NOT NULL,
              amount numeric(10,2) NOT NULL,
              due_date date NOT NULL,
              barcode text,
              status text DEFAULT 'pending' CHECK (status IN ('pending','paid','overdue')),
              is_recurring boolean DEFAULT false,
              frequency text DEFAULT 'monthly',
              recurring_day integer,
              parent_bill_id uuid REFERENCES finance_bills(id),
              payment_date date,
              created_at timestamptz DEFAULT now() NOT NULL
          );
          CREATE TABLE finance_incomes (
              id uuid DEFAULT gen_random_uuid() PRIMARY KEY,
              title text NOT NULL,
              description text,
              amount numeric(10,2) NOT NULL,
              date date NOT NULL,
              type text DEFAULT 'salary' CHECK (type IN ('salary','extra','adjustment')),
              is_recurring boolean DEFAULT false,
              created_at timestamptz DEFAULT now() NOT NULL
          );
          CREATE TABLE finance_user_settings (
              id uuid DEFAULT gen_random_uuid() PRIMARY KEY,
              initial_balance numeric(10,2) DEFAULT 0,
              initial_balance_date date DEFAULT CURRENT_DATE,
              emergency_fund_goal numeric(10,2) DEFAULT 0,
              emergency_fund_balance numeric(10,2) DEFAULT 0,
              latest_insight_text text,
              latest_insight_date date,
              created_at timestamptz DEFAULT now() NOT NULL,
              updated_at timestamptz DEFAULT now() NOT NULL
          );
          SQL

      - name: Apply ownership, idempotency and base data-plane migrations
        shell: bash
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f backend/migrations/002_recurring_instance_uniqueness.sql
          psql -v ON_ERROR_STOP=1 -f backend/migrations/003_user_ownership_rls.sql
          psql -v ON_ERROR_STOP=1 -f backend/migrations/004_enforce_owner_not_null.sql
          psql -v ON_ERROR_STOP=1 -f backend/migrations/005_private_receipt_paths.sql
          psql -v ON_ERROR_STOP=1 -f backend/migrations/006_financial_idempotency.sql
          psql -v ON_ERROR_STOP=1 -f backend/migrations/007_authenticated_data_plane.sql
          psql -v ON_ERROR_STOP=1 -f backend/migrations/008_payment_recurring_data_plane.sql
          psql -v ON_ERROR_STOP=1 -f backend/migrations/009_revoke_authenticated_table_dml.sql

      - name: Initial-balance migration fails closed on historical future baseline
        shell: bash
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO auth.users(id) VALUES ('33333333-3333-3333-3333-333333333333');
          INSERT INTO finance_user_settings(owner_id,initial_balance,initial_balance_date,emergency_fund_goal)
          VALUES (
            '33333333-3333-3333-3333-333333333333',
            '999.00',
            (timezone('America/Sao_Paulo',now())::date + 1),
            '100.00'
          );
          SQL

          if psql -v ON_ERROR_STOP=1 -f backend/migrations/010_initial_balance_date_boundary.sql; then
            echo "Migration 010 unexpectedly accepted an existing future initial_balance_date" >&2
            exit 1
          fi

          test "$(psql -Atc "SELECT count(*) FROM finance_user_settings WHERE owner_id='33333333-3333-3333-3333-333333333333';")" = '1'
          psql -v ON_ERROR_STOP=1 <<'SQL'
          DELETE FROM finance_user_settings WHERE owner_id='33333333-3333-3333-3333-333333333333';
          DELETE FROM auth.users WHERE id='33333333-3333-3333-3333-333333333333';
          SQL
          psql -v ON_ERROR_STOP=1 -f backend/migrations/010_initial_balance_date_boundary.sql

      - name: Seed two owners outside authenticated role
        shell: bash
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO auth.users(id) VALUES
            ('11111111-1111-1111-1111-111111111111'),
            ('22222222-2222-2222-2222-222222222222');
          INSERT INTO finance_bills(owner_id,description,amount,due_date,status,is_recurring)
          VALUES
            ('11111111-1111-1111-1111-111111111111','Owner A seed','10.00',DATE '2026-09-01','pending',false),
            ('22222222-2222-2222-2222-222222222222','Owner B seed','20.00',DATE '2026-09-02','pending',false);
          INSERT INTO finance_user_settings(owner_id,initial_balance,initial_balance_date,emergency_fund_goal)
          VALUES
            ('11111111-1111-1111-1111-111111111111','100.00',DATE '2026-01-01','50.00'),
            ('22222222-2222-2222-2222-222222222222','200.00',DATE '2026-01-01','75.00');
          SQL

      - name: Owner-scoped SELECT remains available
        shell: bash
        run: |
          set -euo pipefail
          visible=$(psql -Atqv ON_ERROR_STOP=1 <<'SQL'
          SELECT set_config('request.jwt.claim.sub','11111111-1111-1111-1111-111111111111',false);
          SET ROLE authenticated;
          SELECT string_agg(description,',' ORDER BY description) FROM finance_bills;
          RESET ROLE;
          SQL
          )
          test "$(printf '%s\n' "$visible" | tail -n1)" = 'Owner A seed'

      - name: Direct authenticated INSERT UPDATE DELETE are denied
        shell: bash
        run: |
          set -euo pipefail
          for statement in \
            "INSERT INTO finance_bills(description,amount,due_date) VALUES ('bypass','1.00',DATE '2026-09-03')" \
            "UPDATE finance_bills SET amount='999999.99' WHERE description='Owner A seed'" \
            "DELETE FROM finance_bills WHERE description='Owner A seed'" \
            "INSERT INTO finance_incomes(title,amount,date) VALUES ('bypass','1.00',DATE '2026-09-03')" \
            "UPDATE finance_user_settings SET emergency_fund_balance='999999.99'" \
            "DELETE FROM finance_user_settings"; do
            if psql -v ON_ERROR_STOP=1 <<SQL
          SELECT set_config('request.jwt.claim.sub','11111111-1111-1111-1111-111111111111',false);
          SET ROLE authenticated;
          $statement;
          SQL
            then
              echo "Direct authenticated DML unexpectedly succeeded: $statement" >&2
              exit 1
            fi
          done

      - name: Sanctioned idempotent financial writes succeed and replay exactly once
        shell: bash
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 <<'SQL'
          SELECT set_config('request.jwt.claim.sub','11111111-1111-1111-1111-111111111111',false);
          SET ROLE authenticated;
          SELECT public.finance_idempotent_add_bill('billkey01','Internet','123.45',DATE '2026-09-10',NULL);
          SELECT public.finance_idempotent_add_bill('billkey01','Internet','123.45',DATE '2026-09-10',NULL);
          SELECT public.finance_idempotent_add_income('incomek1','Salary','500.25',DATE '2026-08-15',NULL,'salary',false);
          RESET ROLE;
          SQL
          test "$(psql -Atc "SELECT count(*) FROM finance_bills WHERE owner_id='11111111-1111-1111-1111-111111111111' AND description='Internet';")" = '1'
          test "$(psql -Atc "SELECT count(*) FROM finance_incomes WHERE owner_id='11111111-1111-1111-1111-111111111111' AND title='Salary';")" = '1'

      - name: Future initial-balance date is rejected by authenticated RPC
        shell: bash
        run: |
          set -euo pipefail
          if psql -v ON_ERROR_STOP=1 <<'SQL'
          SELECT set_config('request.jwt.claim.sub','11111111-1111-1111-1111-111111111111',false);
          SET ROLE authenticated;
          SELECT public.finance_replace_settings(
            '125.00',
            (timezone('America/Sao_Paulo',now())::date + 1),
            '250.00'
          );
          SQL
          then
            echo "Future initial_balance_date unexpectedly succeeded" >&2
            exit 1
          fi

          psql -v ON_ERROR_STOP=1 <<'SQL'
          SELECT set_config('request.jwt.claim.sub','11111111-1111-1111-1111-111111111111',false);
          SET ROLE authenticated;
          SELECT public.finance_replace_settings(
            '125.00',
            timezone('America/Sao_Paulo',now())::date,
            '250.00'
          );
          RESET ROLE;
          SQL
          expected=$(psql -Atc "SELECT timezone('America/Sao_Paulo',now())::date;")
          actual=$(psql -Atc "SELECT initial_balance_date FROM finance_user_settings WHERE owner_id='11111111-1111-1111-1111-111111111111';")
          test "$actual" = "$expected"

      - name: Settings RPCs are owner-derived and field scoped
        shell: bash
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 <<'SQL'
          SELECT set_config('request.jwt.claim.sub','11111111-1111-1111-1111-111111111111',false);
          SET ROLE authenticated;
          SELECT public.finance_replace_settings('-10.25',DATE '2026-02-01','250.75');
          SELECT public.finance_update_emergency_fund_goal('300.50');
          SELECT public.finance_store_insight('Synthetic deterministic insight',DATE '2026-08-15');
          SELECT public.finance_idempotent_add_reserve('reserve01','25.25');
          RESET ROLE;
          SQL
          actual=$(psql -Atc "SELECT initial_balance::text || '|' || emergency_fund_goal::text || '|' || emergency_fund_balance::text || '|' || latest_insight_text FROM finance_user_settings WHERE owner_id='11111111-1111-1111-1111-111111111111';")
          test "$actual" = '-10.25|300.50|25.25|Synthetic deterministic insight'
          untouched=$(psql -Atc "SELECT initial_balance::text || '|' || emergency_fund_goal::text FROM finance_user_settings WHERE owner_id='22222222-2222-2222-2222-222222222222';")
          test "$untouched" = '200.00|75.00'

      - name: Payment RPC owns state transition and financial date
        shell: bash
        run: |
          set -euo pipefail
          bill_id=$(psql -Atc "SELECT id FROM finance_bills WHERE owner_id='11111111-1111-1111-1111-111111111111' AND description='Internet';")
          psql -v ON_ERROR_STOP=1 <<SQL
          SELECT set_config('request.jwt.claim.sub','11111111-1111-1111-1111-111111111111',false);
          SET ROLE authenticated;
          SELECT public.finance_mark_bill_paid('$bill_id',NULL);
          SELECT public.finance_mark_bill_paid('$bill_id',NULL);
          RESET ROLE;
          SQL
          expected=$(psql -Atc "SELECT timezone('America/Sao_Paulo',now())::date;")
          actual=$(psql -Atc "SELECT payment_date FROM finance_bills WHERE id='$bill_id';")
          test "$actual" = "$expected"
          test "$(psql -Atc "SELECT status FROM finance_bills WHERE id='$bill_id';")" = 'paid'

      - name: Payment cannot target another owner or recurring template
        shell: bash
        run: |
          set -euo pipefail
          other_id=$(psql -Atc "SELECT id FROM finance_bills WHERE owner_id='22222222-2222-2222-2222-222222222222' LIMIT 1;")
          if psql -v ON_ERROR_STOP=1 <<SQL
          SELECT set_config('request.jwt.claim.sub','11111111-1111-1111-1111-111111111111',false);
          SET ROLE authenticated;
          SELECT public.finance_mark_bill_paid('$other_id',NULL);
          SQL
          then exit 1; fi

          psql -v ON_ERROR_STOP=1 <<'SQL'
          SELECT set_config('request.jwt.claim.sub','11111111-1111-1111-1111-111111111111',false);
          SET ROLE authenticated;
          SELECT public.finance_idempotent_create_recurring_template('recurkey1','Rent','900.00',DATE '2026-09-20',NULL,'monthly',20);
          RESET ROLE;
          SQL
          template_id=$(psql -Atc "SELECT id FROM finance_bills WHERE owner_id='11111111-1111-1111-1111-111111111111' AND is_recurring=true LIMIT 1;")
          if psql -v ON_ERROR_STOP=1 <<SQL
          SELECT set_config('request.jwt.claim.sub','11111111-1111-1111-1111-111111111111',false);
          SET ROLE authenticated;
          SELECT public.finance_mark_bill_paid('$template_id',NULL);
          SQL
          then exit 1; fi

      - name: Recurring child RPC derives fields and converges under retry
        shell: bash
        run: |
          set -euo pipefail
          template_id=$(psql -Atc "SELECT id FROM finance_bills WHERE owner_id='11111111-1111-1111-1111-111111111111' AND is_recurring=true LIMIT 1;")
          psql -v ON_ERROR_STOP=1 <<SQL
          SELECT set_config('request.jwt.claim.sub','11111111-1111-1111-1111-111111111111',false);
          SET ROLE authenticated;
          SELECT public.finance_generate_recurring_child('$template_id');
          SELECT public.finance_generate_recurring_child('$template_id');
          RESET ROLE;
          SQL
          test "$(psql -Atc "SELECT count(*) FROM finance_bills WHERE parent_bill_id='$template_id';")" = '1'
          derived=$(psql -Atc "SELECT amount::text || '|' || is_recurring::text || '|' || status FROM finance_bills WHERE parent_bill_id='$template_id';")
          test "$derived" = '900.00|false|pending'

      - name: Anonymous role cannot read or execute sanctioned RPCs
        shell: bash
        run: |
          set -euo pipefail
          if psql -v ON_ERROR_STOP=1 <<'SQL'
          SET ROLE anon;
          SELECT * FROM finance_bills;
          SQL
          then exit 1; fi
          if psql -v ON_ERROR_STOP=1 <<'SQL'
          SET ROLE anon;
          SELECT public.finance_replace_settings('1.00',DATE '2026-01-01','1.00');
          SQL
          then exit 1; fi
