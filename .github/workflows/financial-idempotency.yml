name: Financial idempotency

on:
  pull_request:
    branches:
      - portfolio/revamp-2026
      - main
  push:
    branches:
      - portfolio/revamp-2026
      - 'work/**'

permissions:
  contents: read

jobs:
  postgres-idempotency:
    name: PostgreSQL mutation idempotency
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: financeflow
          POSTGRES_PASSWORD: financeflow
          POSTGRES_DB: financeflow_idempotency_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U financeflow -d financeflow_idempotency_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: financeflow
      PGPASSWORD: financeflow
      PGDATABASE: financeflow_idempotency_test
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Create Supabase-compatible financial fixture
        shell: bash
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 <<'SQL'
          CREATE EXTENSION IF NOT EXISTS pgcrypto;
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE authenticated NOLOGIN;
          CREATE ROLE rls_probe NOLOGIN;
          GRANT authenticated TO rls_probe;
          CREATE SCHEMA auth;
          CREATE TABLE auth.users (id uuid PRIMARY KEY);
          CREATE FUNCTION auth.uid() RETURNS uuid LANGUAGE sql STABLE AS $$
            SELECT NULLIF(current_setting('request.jwt.claim.sub', true), '')::uuid
          $$;

          CREATE TABLE finance_bills (
            id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
            description text NOT NULL,
            amount numeric(12,2) NOT NULL,
            due_date date NOT NULL,
            barcode text,
            status text NOT NULL DEFAULT 'pending',
            is_recurring boolean NOT NULL DEFAULT false,
            frequency text,
            recurring_day integer,
            parent_bill_id uuid,
            receipt_path text,
            payment_date date
          );
          CREATE TABLE finance_incomes (
            id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
            title text NOT NULL,
            amount numeric(12,2) NOT NULL,
            date date NOT NULL,
            description text,
            type text NOT NULL,
            is_recurring boolean NOT NULL DEFAULT false
          );
          CREATE TABLE finance_user_settings (
            id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
            emergency_fund_balance numeric(12,2) NOT NULL DEFAULT 0
          );
          SQL
          psql -v ON_ERROR_STOP=1 -f backend/migrations/003_user_ownership_rls.sql
          psql -v ON_ERROR_STOP=1 -f backend/migrations/004_enforce_owner_not_null.sql
          psql -v ON_ERROR_STOP=1 -f backend/migrations/006_financial_idempotency.sql

      - name: Seed two isolated owners
        shell: bash
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO auth.users(id) VALUES
            ('11111111-1111-1111-1111-111111111111'),
            ('22222222-2222-2222-2222-222222222222');
          INSERT INTO finance_user_settings(owner_id, emergency_fund_balance) VALUES
            ('11111111-1111-1111-1111-111111111111', 100.00),
            ('22222222-2222-2222-2222-222222222222', 500.00);
          SQL

      - name: Commit then lost response retries exactly once for every scoped mutation
        shell: bash
        run: |
          set -euo pipefail
          owner_a='11111111-1111-1111-1111-111111111111'
          fp_a='aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa'

          # First calls represent committed operations whose client response is discarded.
          psql -qv ON_ERROR_STOP=1 <<SQL >/dev/null
          SELECT set_config('request.jwt.claim.sub','$owner_a',false);
          SET ROLE rls_probe;
          SELECT public.finance_idempotent_add_reserve('reserve-retry-0001','$fp_a',10.00);
          SELECT public.finance_idempotent_add_bill('bill-retry-000001','$fp_a','Internet',123.45,DATE '2026-09-10',NULL);
          SELECT public.finance_idempotent_add_income('income-retry-0001','$fp_a','Salary',1000.00,DATE '2026-08-14',NULL,'salary',false);
          SELECT public.finance_idempotent_create_recurring_template('recurring-retry1','$fp_a','Rent',900.00,DATE '2026-09-05',NULL,'monthly',5);
          RESET ROLE;
          SQL

          # Transport retry uses the SAME logical identity/fingerprint.
          psql -qv ON_ERROR_STOP=1 <<SQL >/dev/null
          SELECT set_config('request.jwt.claim.sub','$owner_a',false);
          SET ROLE rls_probe;
          SELECT public.finance_idempotent_add_reserve('reserve-retry-0001','$fp_a',10.00);
          SELECT public.finance_idempotent_add_bill('bill-retry-000001','$fp_a','Internet',123.45,DATE '2026-09-10',NULL);
          SELECT public.finance_idempotent_add_income('income-retry-0001','$fp_a','Salary',1000.00,DATE '2026-08-14',NULL,'salary',false);
          SELECT public.finance_idempotent_create_recurring_template('recurring-retry1','$fp_a','Rent',900.00,DATE '2026-09-05',NULL,'monthly',5);
          RESET ROLE;
          SQL

          test "$(psql -Atc "SELECT emergency_fund_balance FROM finance_user_settings WHERE owner_id='$owner_a';")" = '110.00'
          test "$(psql -Atc "SELECT count(*) FROM finance_bills WHERE owner_id='$owner_a' AND description='Internet';")" = '1'
          test "$(psql -Atc "SELECT count(*) FROM finance_incomes WHERE owner_id='$owner_a' AND title='Salary';")" = '1'
          test "$(psql -Atc "SELECT count(*) FROM finance_bills WHERE owner_id='$owner_a' AND description='Rent' AND is_recurring=true;")" = '1'
          test "$(psql -Atc "SELECT count(*) FROM financeflow_private.idempotency_operations WHERE owner_id='$owner_a' AND completed_at IS NOT NULL;")" = '4'

      - name: Same key with different payload fails closed
        shell: bash
        run: |
          set -euo pipefail
          owner_a='11111111-1111-1111-1111-111111111111'
          fp_b='bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb'
          if psql -qv ON_ERROR_STOP=1 <<SQL
          SELECT set_config('request.jwt.claim.sub','$owner_a',false);
          SET ROLE rls_probe;
          SELECT public.finance_idempotent_add_reserve('reserve-retry-0001','$fp_b',99.00);
          SQL
          then
            echo 'same key + different payload unexpectedly succeeded' >&2
            exit 1
          fi
          test "$(psql -Atc "SELECT emergency_fund_balance FROM finance_user_settings WHERE owner_id='$owner_a';")" = '110.00'

      - name: Same opaque key is isolated by authenticated owner
        shell: bash
        run: |
          set -euo pipefail
          owner_b='22222222-2222-2222-2222-222222222222'
          fp='aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa'
          psql -qv ON_ERROR_STOP=1 <<SQL >/dev/null
          SELECT set_config('request.jwt.claim.sub','$owner_b',false);
          SET ROLE rls_probe;
          SELECT public.finance_idempotent_add_reserve('reserve-retry-0001','$fp',10.00);
          SELECT public.finance_idempotent_add_bill('bill-retry-000001','$fp','Internet B',50.00,DATE '2026-09-11',NULL);
          RESET ROLE;
          SQL
          test "$(psql -Atc "SELECT emergency_fund_balance FROM finance_user_settings WHERE owner_id='$owner_b';")" = '510.00'
          test "$(psql -Atc "SELECT count(*) FROM finance_bills WHERE owner_id='$owner_b' AND description='Internet B';")" = '1'
          test "$(psql -Atc "SELECT count(*) FROM financeflow_private.idempotency_operations WHERE owner_id='$owner_b';")" = '2'

      - name: New key intentionally repeats equal business values as a new operation
        shell: bash
        run: |
          set -euo pipefail
          owner_a='11111111-1111-1111-1111-111111111111'
          fp='aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa'
          psql -qv ON_ERROR_STOP=1 <<SQL >/dev/null
          SELECT set_config('request.jwt.claim.sub','$owner_a',false);
          SET ROLE rls_probe;
          SELECT public.finance_idempotent_add_reserve('reserve-new-0000001','$fp',10.00);
          SELECT public.finance_idempotent_add_bill('bill-new-000000001','$fp','Internet',123.45,DATE '2026-09-10',NULL);
          SELECT public.finance_idempotent_add_income('income-new-000001','$fp','Salary',1000.00,DATE '2026-08-14',NULL,'salary',false);
          SELECT public.finance_idempotent_create_recurring_template('recurring-new-001','$fp','Rent',900.00,DATE '2026-09-05',NULL,'monthly',5);
          RESET ROLE;
          SQL
          test "$(psql -Atc "SELECT emergency_fund_balance FROM finance_user_settings WHERE owner_id='$owner_a';")" = '120.00'
          test "$(psql -Atc "SELECT count(*) FROM finance_bills WHERE owner_id='$owner_a' AND description='Internet';")" = '2'
          test "$(psql -Atc "SELECT count(*) FROM finance_incomes WHERE owner_id='$owner_a' AND title='Salary';")" = '2'
          test "$(psql -Atc "SELECT count(*) FROM finance_bills WHERE owner_id='$owner_a' AND description='Rent' AND is_recurring=true;")" = '2'

      - name: Concurrent same-key reserve requests produce one increment
        shell: bash
        run: |
          set -euo pipefail
          owner='11111111-1111-1111-1111-111111111111'
          fp='cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc'
          before=$(psql -Atc "SELECT emergency_fund_balance FROM finance_user_settings WHERE owner_id='$owner';")
          psql -qv ON_ERROR_STOP=1 <<SQL > reserve-a.log 2>&1 & pid_a=$!
          BEGIN;
          SELECT set_config('request.jwt.claim.sub','$owner',false);
          SET ROLE rls_probe;
          SELECT public.finance_idempotent_add_reserve('reserve-concurrent1','$fp',10.00);
          SELECT pg_sleep(1);
          COMMIT;
          SQL
          sleep 0.2
          psql -qv ON_ERROR_STOP=1 <<SQL > reserve-b.log 2>&1 & pid_b=$!
          SELECT set_config('request.jwt.claim.sub','$owner',false);
          SET ROLE rls_probe;
          SELECT public.finance_idempotent_add_reserve('reserve-concurrent1','$fp',10.00);
          SQL
          wait "$pid_a"
          wait "$pid_b"
          after=$(psql -Atc "SELECT emergency_fund_balance FROM finance_user_settings WHERE owner_id='$owner';")
          test "$before" = '120.00'
          test "$after" = '130.00'
          test "$(psql -Atc "SELECT count(*) FROM financeflow_private.idempotency_operations WHERE owner_id='$owner' AND operation_type='reserve_add' AND idempotency_key='reserve-concurrent1';")" = '1'

      - name: Concurrent same-key inserts create one bill, income and recurring template
        shell: bash
        run: |
          set -euo pipefail
          owner='11111111-1111-1111-1111-111111111111'
          fp='dddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddd'
          for operation in bill income recurring; do
            case "$operation" in
              bill)
                call="SELECT public.finance_idempotent_add_bill('bill-concurrent01','$fp','Concurrent bill',42.00,DATE '2026-10-01',NULL);" ;;
              income)
                call="SELECT public.finance_idempotent_add_income('income-concurrent1','$fp','Concurrent income',42.00,DATE '2026-08-14',NULL,'extra',false);" ;;
              recurring)
                call="SELECT public.finance_idempotent_create_recurring_template('recurring-conc01','$fp','Concurrent recurring',42.00,DATE '2026-10-02',NULL,'monthly',2);" ;;
            esac
            psql -qv ON_ERROR_STOP=1 <<SQL > "$operation-a.log" 2>&1 & pid_a=$!
            BEGIN;
            SELECT set_config('request.jwt.claim.sub','$owner',false);
            SET ROLE rls_probe;
            $call
            SELECT pg_sleep(1);
            COMMIT;
            SQL
            sleep 0.2
            psql -qv ON_ERROR_STOP=1 <<SQL > "$operation-b.log" 2>&1 & pid_b=$!
            SELECT set_config('request.jwt.claim.sub','$owner',false);
            SET ROLE rls_probe;
            $call
            SQL
            wait "$pid_a"
            wait "$pid_b"
          done
          test "$(psql -Atc "SELECT count(*) FROM finance_bills WHERE owner_id='$owner' AND description='Concurrent bill';")" = '1'
          test "$(psql -Atc "SELECT count(*) FROM finance_incomes WHERE owner_id='$owner' AND title='Concurrent income';")" = '1'
          test "$(psql -Atc "SELECT count(*) FROM finance_bills WHERE owner_id='$owner' AND description='Concurrent recurring' AND is_recurring=true;")" = '1'

      - name: Upload concurrency diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: financial-idempotency-races
          path: |
            reserve-a.log
            reserve-b.log
            bill-a.log
            bill-b.log
            income-a.log
            income-b.log
            recurring-a.log
            recurring-b.log
          if-no-files-found: ignore
