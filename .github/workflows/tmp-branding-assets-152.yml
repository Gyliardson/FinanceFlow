name: Temporary branding asset generator 152

on:
  push:
    branches:
      - work/152-mobile-production-branding
    paths:
      - '.github/workflows/tmp-branding-assets-152.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: work/152-mobile-production-branding
      - name: Generate standards-compliant PNG artwork
        run: |
          python - <<'PY'
          import struct
          import zlib
          from pathlib import Path

          SIZE = 1024
          INDIGO = (67, 56, 202, 255)
          MINT = (167, 243, 208, 255)
          TRANSPARENT = (0, 0, 0, 0)

          def rounded_rect(x, y, left, top, right, bottom, radius):
              if left + radius <= x < right - radius and top <= y < bottom:
                  return True
              if left <= x < right and top + radius <= y < bottom - radius:
                  return True
              cx = left + radius if x < left + radius else right - radius - 1
              cy = top + radius if y < top + radius else bottom - radius - 1
              return (x - cx) ** 2 + (y - cy) ** 2 <= radius ** 2

          def pixel(x, y, transparent):
              background = TRANSPARENT if transparent else INDIGO
              # A centered, mask-safe FinanceFlow "F" mark.
              if rounded_rect(x, y, 300, 250, 420, 774, 42):
                  return MINT
              if rounded_rect(x, y, 360, 250, 730, 370, 42):
                  return MINT
              if rounded_rect(x, y, 360, 452, 635, 572, 42):
                  return MINT
              # Small flow accent, kept inside the adaptive-icon safe zone.
              if 555 <= x < 685 and 620 <= y < 650:
                  return MINT
              if 655 <= x < 685 and 550 <= y < 650:
                  return MINT
              return background

          def chunk(kind, data):
              crc = zlib.crc32(kind + data) & 0xFFFFFFFF
              return struct.pack('>I', len(data)) + kind + data + struct.pack('>I', crc)

          def write_png(path, transparent=False):
              rows = bytearray()
              for y in range(SIZE):
                  rows.append(0)  # PNG filter: None
                  for x in range(SIZE):
                      rows.extend(pixel(x, y, transparent))
              ihdr = struct.pack('>IIBBBBB', SIZE, SIZE, 8, 6, 0, 0, 0)
              png = (
                  b'\x89PNG\r\n\x1a\n'
                  + chunk(b'IHDR', ihdr)
                  + chunk(b'IDAT', zlib.compress(bytes(rows), level=9))
                  + chunk(b'IEND', b'')
              )
              Path(path).write_bytes(png)

          assets = Path('mobile/assets')
          write_png(assets / 'icon.png')
          write_png(assets / 'splash-icon.png')
          write_png(assets / 'favicon.png')
          write_png(assets / 'adaptive-icon.png', transparent=True)
          PY
      - name: Verify generated PNGs with system decoder
        run: |
          python - <<'PY'
          import struct
          import zlib
          from pathlib import Path

          for path in sorted(Path('mobile/assets').glob('*.png')):
              data = path.read_bytes()
              assert data[:8] == b'\x89PNG\r\n\x1a\n', path
              offset = 8
              seen_iend = False
              while offset < len(data):
                  length = struct.unpack('>I', data[offset:offset+4])[0]
                  kind = data[offset+4:offset+8]
                  payload = data[offset+8:offset+8+length]
                  expected = struct.unpack('>I', data[offset+8+length:offset+12+length])[0]
                  actual = zlib.crc32(kind + payload) & 0xFFFFFFFF
                  assert actual == expected, f'{path}: bad CRC in {kind!r}'
                  offset += 12 + length
                  if kind == b'IEND':
                      seen_iend = True
                      break
              assert seen_iend and offset == len(data), f'{path}: malformed PNG structure'
              print(f'VALID_PNG={path}')
          PY
      - name: Commit regenerated assets
        run: |
          if git diff --quiet -- mobile/assets/icon.png mobile/assets/splash-icon.png mobile/assets/favicon.png mobile/assets/adaptive-icon.png; then
            echo 'BRANDING_ASSETS_ALREADY_VALID=1'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mobile/assets/icon.png mobile/assets/splash-icon.png mobile/assets/favicon.png mobile/assets/adaptive-icon.png
          git commit -m 'fix(mobile): regenerate valid branding PNGs (#152)'
          git push origin HEAD:work/152-mobile-production-branding
