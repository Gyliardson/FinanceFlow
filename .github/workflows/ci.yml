name: FinanceFlow CI

on:
  pull_request:
    branches:
      - portfolio/revamp-2026
      - main
  push:
    branches:
      - portfolio/revamp-2026
      - 'work/**'

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      API_SECRET_KEY: ci-test-key
      SUPABASE_URL: http://127.0.0.1:54321
      SUPABASE_KEY: ci-placeholder
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder
      GEMINI_API_KEY: ci-placeholder
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        shell: bash
        run: |
          set -o pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt 2>&1 | tee dependency-install.log

      - name: Upload dependency install diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-dependency-install
          path: backend/dependency-install.log
          if-no-files-found: warn

      - name: Verify dependency consistency
        run: python -m pip check

      - name: Compile Python sources
        run: python -m compileall -q .

      - name: Run backend tests
        run: pytest -q

  mobile:
    name: Mobile typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.13.0'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

  expo57-probe:
    name: Expo SDK 57 migration probe
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.13.0'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install current dependencies
        run: npm ci

      - name: Move core runtime to Expo SDK 57
        env:
          CI: '1'
        run: npm install expo@~57.0.12 react@19.2.3 react-dom@19.2.3 react-native@0.86.0

      - name: Align Expo-managed dependencies
        env:
          CI: '1'
        run: npx expo install --fix --npm

      - name: Apply npm audit fixes without force
        shell: bash
        run: |
          set +e
          npm audit fix
          audit_fix_status=$?
          set -e
          if [ "$audit_fix_status" -ne 0 ] && [ "$audit_fix_status" -ne 1 ]; then
            exit "$audit_fix_status"
          fi

      - name: TypeScript check on migrated graph
        run: npx tsc --noEmit

      - name: Expo doctor
        run: npx expo-doctor

      - name: Audit migrated mobile dependencies
        run: npm audit --audit-level=high --json > npm-audit-expo57.json

      - name: Upload migration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: expo57-migration-probe
          path: |
            mobile/package.json
            mobile/package-lock.json
            mobile/npm-audit-expo57.json
          if-no-files-found: warn

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Python audit tooling
        run: python -m pip install --upgrade pip pip-audit

      - name: Audit Python dependencies
        run: pip-audit -r backend/requirements.txt --format json --output pip-audit.json

      - name: Upload Python audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-report
          path: pip-audit.json
          if-no-files-found: warn

      - name: Setup Node.js
        if: always()
        uses: actions/setup-node@v6
        with:
          node-version: '22.13.0'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install mobile dependencies for audit
        if: always()
        working-directory: mobile
        run: npm ci --ignore-scripts

      - name: Audit mobile dependencies
        if: always()
        working-directory: mobile
        run: npm audit --audit-level=high --json > npm-audit.json

      - name: Upload mobile audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: mobile/npm-audit.json
          if-no-files-found: warn

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Scan repository history for secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
