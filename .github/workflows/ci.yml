name: FinanceFlow CI

on:
  pull_request:
    branches:
      - portfolio/revamp-2026
      - main
  push:
    branches:
      - portfolio/revamp-2026
      - 'work/**'

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      API_SECRET_KEY: ci-test-key
      SUPABASE_URL: http://127.0.0.1:54321
      SUPABASE_KEY: ci-placeholder
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder
      GEMINI_API_KEY: ci-placeholder
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        shell: bash
        run: |
          set -o pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt 2>&1 | tee dependency-install.log

      - name: Upload dependency install diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-dependency-install
          path: backend/dependency-install.log
          if-no-files-found: warn

      - name: Verify dependency consistency
        run: python -m pip check

      - name: Compile Python sources
        run: python -m compileall -q .

      - name: Run backend tests
        run: pytest -q

  postgres-recurring:
    name: PostgreSQL recurring idempotency
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: financeflow
          POSTGRES_PASSWORD: financeflow
          POSTGRES_DB: financeflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U financeflow -d financeflow_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: financeflow
      PGPASSWORD: financeflow
      PGDATABASE: financeflow_test
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Create minimal recurring-bill schema
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          CREATE TABLE finance_bills (
            id text PRIMARY KEY,
            parent_bill_id text,
            due_date date NOT NULL,
            is_recurring boolean DEFAULT false
          );
          SQL

      - name: Monetary NUMERIC round-trip is exact
        shell: bash
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 <<'SQL'
          CREATE TABLE finance_money_probe (
            label text PRIMARY KEY,
            amount numeric(12,2) NOT NULL
          );
          INSERT INTO finance_money_probe (label, amount)
          VALUES
            ('cent', '0.01'),
            ('fraction', '0.30'),
            ('negative', '-10.01'),
            ('large', '1000000.00');
          SQL

          actual=$(psql -Atc "SELECT string_agg(label || ':' || amount::text, ',' ORDER BY label) FROM finance_money_probe;")
          expected='cent:0.01,fraction:0.30,large:1000000.00,negative:-10.01'
          test "$actual" = "$expected"

      - name: Migration fails closed without deleting historical duplicates
        shell: bash
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO finance_bills (id, parent_bill_id, due_date, is_recurring)
          VALUES
            ('template-history', NULL, '2026-08-01', true),
            ('history-1', 'template-history', '2026-08-15', false),
            ('history-2', 'template-history', '2026-08-15', false);
          SQL

          if psql -v ON_ERROR_STOP=1 -f backend/migrations/002_recurring_instance_uniqueness.sql; then
            echo 'Migration unexpectedly accepted historical duplicate generated bills.' >&2
            exit 1
          fi

          duplicate_count=$(psql -Atc "SELECT count(*) FROM finance_bills WHERE parent_bill_id = 'template-history' AND due_date = DATE '2026-08-15';")
          test "$duplicate_count" = "2"

      - name: Apply uniqueness migration after explicit reconciliation
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          DELETE FROM finance_bills WHERE id = 'history-2';
          SQL
          psql -v ON_ERROR_STOP=1 -f backend/migrations/002_recurring_instance_uniqueness.sql
          psql -Atc "SELECT indexname FROM pg_indexes WHERE tablename = 'finance_bills' AND indexname = 'ux_finance_bills_generated_parent_due';" | grep -qx 'ux_finance_bills_generated_parent_due'

      - name: Concurrent generated inserts produce exactly one row
        shell: bash
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -c "INSERT INTO finance_bills (id, parent_bill_id, due_date, is_recurring) VALUES ('template-race', NULL, DATE '2026-08-01', true);"

          set +e
          psql -v ON_ERROR_STOP=1 -c "BEGIN; INSERT INTO finance_bills (id, parent_bill_id, due_date, is_recurring) VALUES ('race-a', 'template-race', DATE '2026-09-10', false); SELECT pg_sleep(1); COMMIT;" > race-a.log 2>&1 &
          pid_a=$!
          sleep 0.2
          psql -v ON_ERROR_STOP=1 -c "INSERT INTO finance_bills (id, parent_bill_id, due_date, is_recurring) VALUES ('race-b', 'template-race', DATE '2026-09-10', false);" > race-b.log 2>&1 &
          pid_b=$!
          wait "$pid_a"; status_a=$?
          wait "$pid_b"; status_b=$?
          set -e

          cat race-a.log
          cat race-b.log

          if [ "$status_a" -eq 0 ] && [ "$status_b" -eq 0 ]; then
            echo 'Both concurrent inserts succeeded; uniqueness invariant failed.' >&2
            exit 1
          fi
          if [ "$status_a" -ne 0 ] && [ "$status_b" -ne 0 ]; then
            echo 'Both concurrent inserts failed; expected one successful writer.' >&2
            exit 1
          fi

          generated_count=$(psql -Atc "SELECT count(*) FROM finance_bills WHERE parent_bill_id = 'template-race' AND due_date = DATE '2026-09-10';")
          test "$generated_count" = "1"

      - name: Retry remains idempotent at database boundary
        shell: bash
        run: |
          set -euo pipefail
          if psql -v ON_ERROR_STOP=1 -c "INSERT INTO finance_bills (id, parent_bill_id, due_date, is_recurring) VALUES ('race-retry', 'template-race', DATE '2026-09-10', false);"; then
            echo 'Retry unexpectedly created a duplicate generated bill.' >&2
            exit 1
          fi
          generated_count=$(psql -Atc "SELECT count(*) FROM finance_bills WHERE parent_bill_id = 'template-race' AND due_date = DATE '2026-09-10';")
          test "$generated_count" = "1"

      - name: Bulk conflict rolls back and retry recovers missing instance
        shell: bash
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO finance_bills (id, parent_bill_id, due_date, is_recurring)
          VALUES
            ('template-partial', NULL, DATE '2026-08-01', true),
            ('partial-existing', 'template-partial', DATE '2026-09-20', false);
          SQL

          if psql -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO finance_bills (id, parent_bill_id, due_date, is_recurring)
          VALUES
            ('partial-conflict', 'template-partial', DATE '2026-09-20', false),
            ('partial-new', 'template-partial', DATE '2026-10-20', false);
          SQL
          then
            echo 'Bulk insert unexpectedly succeeded despite a uniqueness conflict.' >&2
            exit 1
          fi

          rolled_back_count=$(psql -Atc "SELECT count(*) FROM finance_bills WHERE id = 'partial-new';")
          test "$rolled_back_count" = "0"

          psql -v ON_ERROR_STOP=1 -c "INSERT INTO finance_bills (id, parent_bill_id, due_date, is_recurring) VALUES ('partial-retry', 'template-partial', DATE '2026-10-20', false);"
          recovered_count=$(psql -Atc "SELECT count(*) FROM finance_bills WHERE parent_bill_id = 'template-partial' AND due_date = DATE '2026-10-20';")
          test "$recovered_count" = "1"

      - name: Upload PostgreSQL race diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postgres-recurring-race
          path: |
            race-a.log
            race-b.log
          if-no-files-found: ignore

  postgres-ownership:
    name: PostgreSQL ownership and RLS
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: financeflow
          POSTGRES_PASSWORD: financeflow
          POSTGRES_DB: financeflow_security_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U financeflow -d financeflow_security_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: financeflow
      PGPASSWORD: financeflow
      PGDATABASE: financeflow_security_test
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Create Supabase-compatible ownership fixture
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE authenticated NOLOGIN;
          CREATE SCHEMA auth;
          CREATE TABLE auth.users (id uuid PRIMARY KEY);
          CREATE FUNCTION auth.uid() RETURNS uuid
          LANGUAGE sql STABLE
          AS $$
            SELECT NULLIF(current_setting('request.jwt.claim.sub', true), '')::uuid
          $$;

          CREATE TABLE finance_bills (id text PRIMARY KEY);
          CREATE TABLE finance_incomes (id text PRIMARY KEY);
          CREATE TABLE finance_user_settings (id text PRIMARY KEY);
          SQL

      - name: Apply restrictive ownership migration
        run: psql -v ON_ERROR_STOP=1 -f backend/migrations/003_user_ownership_rls.sql

      - name: RLS isolates users and rejects forged ownership
        shell: bash
        run: |
          set -euo pipefail
          user_a='11111111-1111-1111-1111-111111111111'
          user_b='22222222-2222-2222-2222-222222222222'
          psql -v ON_ERROR_STOP=1 <<SQL
          INSERT INTO auth.users(id) VALUES ('$user_a'), ('$user_b');
          INSERT INTO finance_bills(id, owner_id) VALUES ('bill-a', '$user_a'), ('bill-b', '$user_b');
          INSERT INTO finance_incomes(id, owner_id) VALUES ('income-a', '$user_a'), ('income-b', '$user_b');
          INSERT INTO finance_user_settings(id, owner_id) VALUES ('settings-a', '$user_a'), ('settings-b', '$user_b');
          SQL

          visible=$(psql -Atv ON_ERROR_STOP=1 <<SQL
          SELECT set_config('request.jwt.claim.sub', '$user_a', false);
          SET ROLE authenticated;
          SELECT string_agg(id, ',' ORDER BY id) FROM finance_bills;
          RESET ROLE;
          SQL
          )
          test "$(printf '%s\n' "$visible" | tail -n1)" = 'bill-a'

          if psql -v ON_ERROR_STOP=1 <<SQL
          SELECT set_config('request.jwt.claim.sub', '$user_a', false);
          SET ROLE authenticated;
          INSERT INTO finance_bills(id, owner_id) VALUES ('forged-bill', '$user_b');
          SQL
          then
            echo 'Authenticated user unexpectedly inserted a row owned by another user.' >&2
            exit 1
          fi

          changed=$(psql -Atv ON_ERROR_STOP=1 <<SQL
          SELECT set_config('request.jwt.claim.sub', '$user_a', false);
          SET ROLE authenticated;
          UPDATE finance_bills SET id = 'tampered-bill-b' WHERE id = 'bill-b';
          SELECT count(*) FROM finance_bills WHERE id = 'tampered-bill-b';
          RESET ROLE;
          SQL
          )
          test "$(printf '%s\n' "$changed" | tail -n1)" = '0'

      - name: Anonymous role has no financial-table privileges
        shell: bash
        run: |
          set -euo pipefail
          if psql -v ON_ERROR_STOP=1 <<'SQL'
          SET ROLE anon;
          SELECT * FROM finance_bills;
          SQL
          then
            echo 'Anonymous role unexpectedly read finance_bills.' >&2
            exit 1
          fi

      - name: NOT NULL enforcement fails closed until explicit backfill
        shell: bash
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -c "INSERT INTO finance_bills(id, owner_id) VALUES ('legacy-null', NULL);"

          if psql -v ON_ERROR_STOP=1 -f backend/migrations/004_enforce_owner_not_null.sql; then
            echo 'Migration 004 unexpectedly accepted an unowned historical row.' >&2
            exit 1
          fi

          test "$(psql -Atc "SELECT count(*) FROM finance_bills WHERE id='legacy-null' AND owner_id IS NULL;")" = '1'

          psql -v ON_ERROR_STOP=1 -c "UPDATE finance_bills SET owner_id='11111111-1111-1111-1111-111111111111' WHERE id='legacy-null';"
          psql -v ON_ERROR_STOP=1 -f backend/migrations/004_enforce_owner_not_null.sql
          psql -Atc "SELECT is_nullable FROM information_schema.columns WHERE table_name='finance_bills' AND column_name='owner_id';" | grep -qx 'NO'
          psql -Atc "SELECT is_nullable FROM information_schema.columns WHERE table_name='finance_incomes' AND column_name='owner_id';" | grep -qx 'NO'
          psql -Atc "SELECT is_nullable FROM information_schema.columns WHERE table_name='finance_user_settings' AND column_name='owner_id';" | grep -qx 'NO'

  mobile:
    name: Mobile typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.13.0'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

  dependency-audit:
    name: Dependency audit evidence
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Python audit tooling
        run: python -m pip install --upgrade pip pip-audit

      - name: Audit Python dependencies
        run: pip-audit -r backend/requirements.txt --format json --output pip-audit.json

      - name: Upload Python audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-report
          path: pip-audit.json
          if-no-files-found: warn

      - name: Setup Node.js
        if: always()
        uses: actions/setup-node@v6
        with:
          node-version: '22.13.0'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install mobile dependencies for audit
        if: always()
        working-directory: mobile
        run: npm ci --ignore-scripts

      - name: Capture mobile dependency audit
        if: always()
        working-directory: mobile
        shell: bash
        run: |
          set +e
          npm audit --audit-level=high --json > npm-audit.json
          audit_status=$?
          set -e
          echo "Mobile npm audit exit code: ${audit_status}" >> "$GITHUB_STEP_SUMMARY"
          echo "Known mobile dependency remediation is tracked in issue #5; the baseline CI preserves the full audit artifact without hiding findings." >> "$GITHUB_STEP_SUMMARY"
          if [ "$audit_status" -gt 1 ]; then
            exit "$audit_status"
          fi

      - name: Upload mobile audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: mobile/npm-audit.json
          if-no-files-found: warn

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Scan repository history for secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}