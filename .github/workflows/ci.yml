name: FinanceFlow CI

on:
  pull_request:
    branches:
      - portfolio/revamp-2026
      - main
  push:
    branches:
      - portfolio/revamp-2026
      - 'work/**'

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      API_SECRET_KEY: ci-test-key
      SUPABASE_URL: http://127.0.0.1:54321
      SUPABASE_KEY: ci-placeholder
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder
      GEMINI_API_KEY: ci-placeholder
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        shell: bash
        run: |
          set -o pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt 2>&1 | tee dependency-install.log
      - name: Upload dependency install diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-dependency-install
          path: backend/dependency-install.log
          if-no-files-found: warn
      - name: Verify dependency consistency
        run: python -m pip check
      - name: Compile Python sources
        run: python -m compileall -q .
      - name: Run backend tests
        run: pytest -q

  postgres-recurring:
    name: PostgreSQL recurring idempotency
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: financeflow
          POSTGRES_PASSWORD: financeflow
          POSTGRES_DB: financeflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U financeflow -d financeflow_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: financeflow
      PGPASSWORD: financeflow
      PGDATABASE: financeflow_test
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Create minimal recurring-bill schema
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          CREATE TABLE finance_bills (id text PRIMARY KEY, parent_bill_id text, due_date date NOT NULL, is_recurring boolean DEFAULT false);
          SQL
      - name: Monetary NUMERIC round-trip is exact
        shell: bash
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 <<'SQL'
          CREATE TABLE finance_money_probe (label text PRIMARY KEY, amount numeric(12,2) NOT NULL);
          INSERT INTO finance_money_probe (label, amount) VALUES ('cent','0.01'),('fraction','0.30'),('negative','-10.01'),('large','1000000.00');
          SQL
          actual=$(psql -Atc "SELECT string_agg(label || ':' || amount::text, ',' ORDER BY label) FROM finance_money_probe;")
          expected='cent:0.01,fraction:0.30,large:1000000.00,negative:-10.01'
          test "$actual" = "$expected"
      - name: Migration fails closed without deleting historical duplicates
        shell: bash
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO finance_bills (id,parent_bill_id,due_date,is_recurring) VALUES ('template-legacy',NULL,DATE '2026-08-01',true),('legacy-a','template-legacy',DATE '2026-09-15',false),('legacy-b','template-legacy',DATE '2026-09-15',false);
          SQL
          if psql -v ON_ERROR_STOP=1 -f backend/migrations/002_recurring_instance_uniqueness.sql; then exit 1; fi
          test "$(psql -Atc "SELECT count(*) FROM finance_bills WHERE parent_bill_id='template-legacy' AND due_date=DATE '2026-09-15';")" = '2'
          psql -v ON_ERROR_STOP=1 -c "DELETE FROM finance_bills WHERE id='legacy-b';"
      - name: Apply uniqueness migration after explicit reconciliation
        run: psql -v ON_ERROR_STOP=1 -f backend/migrations/002_recurring_instance_uniqueness.sql
      - name: Concurrent generated inserts produce exactly one row
        shell: bash
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -c "INSERT INTO finance_bills (id,parent_bill_id,due_date,is_recurring) VALUES ('template-race',NULL,DATE '2026-08-01',true);"
          set +e
          psql -v ON_ERROR_STOP=1 -c "BEGIN; INSERT INTO finance_bills VALUES ('race-a','template-race',DATE '2026-09-10',false); SELECT pg_sleep(1); COMMIT;" > race-a.log 2>&1 & pid_a=$!
          sleep 0.2
          psql -v ON_ERROR_STOP=1 -c "INSERT INTO finance_bills VALUES ('race-b','template-race',DATE '2026-09-10',false);" > race-b.log 2>&1 & pid_b=$!
          wait "$pid_a"; status_a=$?; wait "$pid_b"; status_b=$?; set -e
          cat race-a.log; cat race-b.log
          if [ "$status_a" -eq 0 ] && [ "$status_b" -eq 0 ]; then exit 1; fi
          if [ "$status_a" -ne 0 ] && [ "$status_b" -ne 0 ]; then exit 1; fi
          test "$(psql -Atc "SELECT count(*) FROM finance_bills WHERE parent_bill_id='template-race' AND due_date=DATE '2026-09-10';")" = '1'
      - name: Retry remains idempotent at database boundary
        shell: bash
        run: |
          set -euo pipefail
          if psql -v ON_ERROR_STOP=1 -c "INSERT INTO finance_bills VALUES ('race-retry','template-race',DATE '2026-09-10',false);"; then exit 1; fi
          test "$(psql -Atc "SELECT count(*) FROM finance_bills WHERE parent_bill_id='template-race' AND due_date=DATE '2026-09-10';")" = '1'
      - name: Bulk conflict rolls back and retry recovers missing instance
        shell: bash
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -c "INSERT INTO finance_bills VALUES ('template-partial',NULL,DATE '2026-08-01',true),('partial-existing','template-partial',DATE '2026-09-20',false);"
          if psql -v ON_ERROR_STOP=1 -c "INSERT INTO finance_bills VALUES ('partial-conflict','template-partial',DATE '2026-09-20',false),('partial-new','template-partial',DATE '2026-10-20',false);"; then exit 1; fi
          test "$(psql -Atc "SELECT count(*) FROM finance_bills WHERE id='partial-new';")" = '0'
          psql -v ON_ERROR_STOP=1 -c "INSERT INTO finance_bills VALUES ('partial-retry','template-partial',DATE '2026-10-20',false);"
      - name: Upload PostgreSQL race diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postgres-recurring-race
          path: |
            race-a.log
            race-b.log
          if-no-files-found: ignore

  postgres-ownership:
    name: PostgreSQL ownership and RLS
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: financeflow
          POSTGRES_PASSWORD: financeflow
          POSTGRES_DB: financeflow_security_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U financeflow -d financeflow_security_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: financeflow
      PGPASSWORD: financeflow
      PGDATABASE: financeflow_security_test
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Create Supabase-compatible ownership fixture
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE authenticated NOLOGIN;
          CREATE ROLE rls_probe NOLOGIN;
          GRANT authenticated TO rls_probe;
          CREATE SCHEMA auth;
          CREATE TABLE auth.users (id uuid PRIMARY KEY);
          CREATE FUNCTION auth.uid() RETURNS uuid LANGUAGE sql STABLE AS $$ SELECT NULLIF(current_setting('request.jwt.claim.sub', true), '')::uuid $$;
          CREATE TABLE finance_bills (id text PRIMARY KEY);
          CREATE TABLE finance_incomes (id text PRIMARY KEY);
          CREATE TABLE finance_user_settings (id text PRIMARY KEY);
          SQL
      - name: Apply restrictive ownership migration
        run: psql -v ON_ERROR_STOP=1 -f backend/migrations/003_user_ownership_rls.sql
      - name: RLS isolates users and rejects forged ownership
        shell: bash
        run: |
          set -euo pipefail
          user_a='11111111-1111-1111-1111-111111111111'
          user_b='22222222-2222-2222-2222-222222222222'
          psql -v ON_ERROR_STOP=1 <<SQL
          INSERT INTO auth.users(id) VALUES ('$user_a'),('$user_b');
          INSERT INTO finance_bills(id,owner_id) VALUES ('bill-a','$user_a'),('bill-b','$user_b');
          INSERT INTO finance_incomes(id,owner_id) VALUES ('income-a','$user_a'),('income-b','$user_b');
          INSERT INTO finance_user_settings(id,owner_id) VALUES ('settings-a','$user_a'),('settings-b','$user_b');
          SQL
          visible=$(psql -Atv ON_ERROR_STOP=1 <<SQL
          SELECT set_config('request.jwt.claim.sub','$user_a',false);
          SET ROLE rls_probe;
          SELECT string_agg(id,',' ORDER BY id) FROM finance_bills;
          RESET ROLE;
          SQL
          )
          test "$(printf '%s\n' "$visible" | tail -n1)" = 'bill-a'
          if psql -v ON_ERROR_STOP=1 <<SQL
          SELECT set_config('request.jwt.claim.sub','$user_a',false);
          SET ROLE rls_probe;
          INSERT INTO finance_bills(id,owner_id) VALUES ('forged-bill','$user_b');
          SQL
          then exit 1; fi
          changed=$(psql -Atv ON_ERROR_STOP=1 <<SQL
          SELECT set_config('request.jwt.claim.sub','$user_a',false);
          SET ROLE rls_probe;
          UPDATE finance_bills SET id='tampered-bill-b' WHERE id='bill-b';
          SELECT count(*) FROM finance_bills WHERE id='tampered-bill-b';
          RESET ROLE;
          SQL
          )
          test "$(printf '%s\n' "$changed" | tail -n1)" = '0'
      - name: Anonymous role has no financial-table privileges
        shell: bash
        run: |
          set -euo pipefail
          if psql -v ON_ERROR_STOP=1 <<'SQL'
          SET ROLE anon;
          SELECT * FROM finance_bills;
          SQL
          then exit 1; fi
      - name: NOT NULL enforcement fails closed until explicit backfill
        shell: bash
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -c "INSERT INTO finance_bills(id,owner_id) VALUES ('legacy-null',NULL);"
          if psql -v ON_ERROR_STOP=1 -f backend/migrations/004_enforce_owner_not_null.sql; then exit 1; fi
          test "$(psql -Atc "SELECT count(*) FROM finance_bills WHERE id='legacy-null' AND owner_id IS NULL;")" = '1'
          psql -v ON_ERROR_STOP=1 -c "UPDATE finance_bills SET owner_id='11111111-1111-1111-1111-111111111111' WHERE id='legacy-null';"
          psql -v ON_ERROR_STOP=1 -f backend/migrations/004_enforce_owner_not_null.sql
          psql -Atc "SELECT is_nullable FROM information_schema.columns WHERE table_name='finance_bills' AND column_name='owner_id';" | grep -qx 'NO'
          psql -Atc "SELECT is_nullable FROM information_schema.columns WHERE table_name='finance_incomes' AND column_name='owner_id';" | grep -qx 'NO'
          psql -Atc "SELECT is_nullable FROM information_schema.columns WHERE table_name='finance_user_settings' AND column_name='owner_id';" | grep -qx 'NO'

  mobile:
    name: Mobile typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22.13.0'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit

  dependency-audit:
    name: Dependency audit evidence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip pip-audit
      - name: Audit Python dependencies
        run: python -m pip_audit -r backend/requirements.txt -f json -o pip-audit.json
      - name: Upload Python audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-report
          path: pip-audit.json
      - uses: actions/setup-node@v6
        with:
          node-version: '22.13.0'
      - name: Install mobile dependencies for audit
        working-directory: mobile
        run: npm ci --ignore-scripts
      - name: Capture mobile dependency audit
        working-directory: mobile
        run: npm audit --json > npm-audit.json || true
      - name: Upload mobile audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: mobile/npm-audit.json

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Scan repository history for secrets
        uses: gitleaks/gitleaks-action@v3