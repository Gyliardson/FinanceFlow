name: FinanceFlow CI

on:
  pull_request:
    branches:
      - portfolio/revamp-2026
      - main
  push:
    branches:
      - portfolio/revamp-2026
      - 'work/**'

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      API_SECRET_KEY: ci-test-key
      SUPABASE_URL: http://127.0.0.1:54321
      SUPABASE_KEY: ci-placeholder
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder
      GEMINI_API_KEY: ci-placeholder
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        shell: bash
        run: |
          set -o pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt 2>&1 | tee dependency-install.log

      - name: Upload dependency install diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-dependency-install
          path: backend/dependency-install.log
          if-no-files-found: warn

      - name: Verify dependency consistency
        run: python -m pip check

      - name: Compile Python sources
        run: python -m compileall -q .

      - name: Run backend tests
        run: pytest -q

  postgres-recurring:
    name: PostgreSQL recurring idempotency
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: financeflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d financeflow_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/financeflow_test
      PGPASSWORD: postgres
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Create disposable recurring-bill schema
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          CREATE TABLE finance_bills (
            id UUID PRIMARY KEY,
            parent_bill_id UUID,
            due_date DATE NOT NULL,
            is_recurring BOOLEAN DEFAULT FALSE
          );

          INSERT INTO finance_bills (id, parent_bill_id, due_date, is_recurring) VALUES
            ('00000000-0000-0000-0000-000000000001', '10000000-0000-0000-0000-000000000001', '2026-08-20', FALSE),
            ('00000000-0000-0000-0000-000000000002', '10000000-0000-0000-0000-000000000001', '2026-08-20', FALSE);
          SQL

      - name: Apply recurring uniqueness migration
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f backend/migrations/002_recurring_instance_uniqueness.sql

      - name: Verify duplicate cleanup and unique index
        shell: bash
        run: |
          duplicate_count=$(psql "$DATABASE_URL" -At -v ON_ERROR_STOP=1 -c "SELECT COUNT(*) FROM finance_bills WHERE parent_bill_id = '10000000-0000-0000-0000-000000000001' AND due_date = '2026-08-20';")
          test "$duplicate_count" = "1"

          index_count=$(psql "$DATABASE_URL" -At -v ON_ERROR_STOP=1 -c "SELECT COUNT(*) FROM pg_indexes WHERE tablename = 'finance_bills' AND indexname = 'ux_finance_bills_generated_parent_due';")
          test "$index_count" = "1"

      - name: Prove concurrent retry cannot double insert
        shell: bash
        run: |
          set +e
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "INSERT INTO finance_bills (id, parent_bill_id, due_date, is_recurring) VALUES ('00000000-0000-0000-0000-000000000003', '10000000-0000-0000-0000-000000000002', '2026-09-20', FALSE);" &
          first_pid=$!
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "INSERT INTO finance_bills (id, parent_bill_id, due_date, is_recurring) VALUES ('00000000-0000-0000-0000-000000000004', '10000000-0000-0000-0000-000000000002', '2026-09-20', FALSE);" &
          second_pid=$!
          wait "$first_pid"
          first_status=$?
          wait "$second_pid"
          second_status=$?
          set -e

          if [ "$first_status" -eq "$second_status" ]; then
            echo "Expected exactly one concurrent insert to succeed and one to hit the uniqueness invariant."
            exit 1
          fi

          final_count=$(psql "$DATABASE_URL" -At -v ON_ERROR_STOP=1 -c "SELECT COUNT(*) FROM finance_bills WHERE parent_bill_id = '10000000-0000-0000-0000-000000000002' AND due_date = '2026-09-20';")
          test "$final_count" = "1"

  mobile:
    name: Mobile typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.13.0'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

  dependency-audit:
    name: Dependency audit evidence
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Python audit tooling
        run: python -m pip install --upgrade pip pip-audit

      - name: Audit Python dependencies
        run: pip-audit -r backend/requirements.txt --format json --output pip-audit.json

      - name: Upload Python audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-report
          path: pip-audit.json
          if-no-files-found: warn

      - name: Setup Node.js
        if: always()
        uses: actions/setup-node@v6
        with:
          node-version: '22.13.0'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install mobile dependencies for audit
        if: always()
        working-directory: mobile
        run: npm ci --ignore-scripts

      - name: Capture mobile dependency audit
        if: always()
        working-directory: mobile
        shell: bash
        run: |
          set +e
          npm audit --audit-level=high --json > npm-audit.json
          audit_status=$?
          set -e
          echo "Mobile npm audit exit code: ${audit_status}" >> "$GITHUB_STEP_SUMMARY"
          echo "Known mobile dependency remediation is tracked in issue #5; the baseline CI preserves the full audit artifact without hiding findings." >> "$GITHUB_STEP_SUMMARY"
          if [ "$audit_status" -gt 1 ]; then
            exit "$audit_status"
          fi

      - name: Upload mobile audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: mobile/npm-audit.json
          if-no-files-found: warn

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Scan repository history for secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
