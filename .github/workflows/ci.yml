name: FinanceFlow CI

on:
  pull_request:
    branches:
      - portfolio/revamp-2026
      - main
  push:
    branches:
      - portfolio/revamp-2026
      - 'work/**'

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      SUPABASE_URL: http://127.0.0.1:54321
      SUPABASE_KEY: ci-placeholder
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder
      GEMINI_API_KEY: ci-placeholder
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        shell: bash
        run: |
          set -o pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt 2>&1 | tee dependency-install.log
      - name: Upload dependency install diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-dependency-install
          path: backend/dependency-install.log
          if-no-files-found: warn
      - name: Verify dependency consistency
        run: python -m pip check
      - name: Compile Python sources
        run: python -m compileall -q .
      - name: Run backend tests
        shell: bash
        run: |
          set -o pipefail
          pytest -q 2>&1 | tee pytest.log
      - name: Upload backend test diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-pytest-report
          path: backend/pytest.log
          if-no-files-found: warn

  postgres-recurring:
    name: PostgreSQL recurring idempotency
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: financeflow
          POSTGRES_PASSWORD: financeflow
          POSTGRES_DB: financeflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U financeflow -d financeflow_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: financeflow
      PGPASSWORD: financeflow
      PGDATABASE: financeflow_test
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Create minimal recurring-bill schema
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          CREATE TABLE finance_bills (id text PRIMARY KEY, parent_bill_id text, due_date date NOT NULL, is_recurring boolean DEFAULT false);
          SQL
      - name: Monetary NUMERIC round-trip is exact
        shell: bash
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 <<'SQL'
          CREATE TABLE finance_money_probe (label text PRIMARY KEY, amount numeric(12,2) NOT NULL);
          INSERT INTO finance_money_probe (label, amount) VALUES ('cent','0.01'),('fraction','0.30'),('negative','-10.01'),('large','1000000.00');
          SQL
          actual=$(psql -Atc "SELECT string_agg(label || ':' || amount::text, ',' ORDER BY label) FROM finance_money_probe;")
          expected='cent:0.01,fraction:0.30,large:1000000.00,negative:-10.01'
          test "$actual" = "$expected"
      - name: Migration fails closed without deleting historical duplicates
        shell: bash
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO finance_bills (id,parent_bill_id,due_date,is_recurring) VALUES ('template-legacy',NULL,DATE '2026-08-01',true),('legacy-a','template-legacy',DATE '2026-09-15',false),('legacy-b','template-legacy',DATE '2026-09-15',false);
          SQL
          if psql -v ON_ERROR_STOP=1 -f backend/migrations/002_recurring_instance_uniqueness.sql; then exit 1; fi
          test "$(psql -Atc "SELECT count(*) FROM finance_bills WHERE parent_bill_id='template-legacy' AND due_date=DATE '2026-09-15';")" = '2'
          psql -v ON_ERROR_STOP=1 -c "DELETE FROM finance_bills WHERE id='legacy-b';"
      - name: Apply uniqueness migration after explicit reconciliation
        run: psql -v ON_ERROR_STOP=1 -f backend/migrations/002_recurring_instance_uniqueness.sql
      - name: Concurrent generated inserts produce exactly one row
        shell: bash
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -c "INSERT INTO finance_bills (id,parent_bill_id,due_date,is_recurring) VALUES ('template-race',NULL,DATE '2026-08-01',true);"
          set +e
          psql -v ON_ERROR_STOP=1 -c "BEGIN; INSERT INTO finance_bills VALUES ('race-a','template-race',DATE '2026-09-10',false); SELECT pg_sleep(1); COMMIT;" > race-a.log 2>&1 & pid_a=$!
          sleep 0.2
          psql -v ON_ERROR_STOP=1 -c "INSERT INTO finance_bills VALUES ('race-b','template-race',DATE '2026-09-10',false);" > race-b.log 2>&1 & pid_b=$!
          wait "$pid_a"; status_a=$?; wait "$pid_b"; status_b=$?; set -e
          cat race-a.log; cat race-b.log
          if [ "$status_a" -eq 0 ] && [ "$status_b" -eq 0 ]; then exit 1; fi
          if [ "$status_a" -ne 0 ] && [ "$status_b" -ne 0 ]; then exit 1; fi
          test "$(psql -Atc "SELECT count(*) FROM finance_bills WHERE parent_bill_id='template-race' AND due_date=DATE '2026-09-10';")" = '1'
      - name: Retry remains idempotent at database boundary
        shell: bash
        run: |
          set -euo pipefail
          if psql -v ON_ERROR_STOP=1 -c "INSERT INTO finance_bills VALUES ('race-retry','template-race',DATE '2026-09-10',false);"; then exit 1; fi
          test "$(psql -Atc "SELECT count(*) FROM finance_bills WHERE parent_bill_id='template-race' AND due_date=DATE '2026-09-10';")" = '1'
      - name: Bulk conflict rolls back and retry recovers missing instance
        shell: bash
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -c "INSERT INTO finance_bills VALUES ('template-partial',NULL,DATE '2026-08-01',true),('partial-existing','template-partial',DATE '2026-09-20',false);"
          if psql -v ON_ERROR_STOP=1 -c "INSERT INTO finance_bills VALUES ('partial-conflict','template-partial',DATE '2026-09-20',false),('partial-new','template-partial',DATE '2026-10-20',false);"; then exit 1; fi
          test "$(psql -Atc "SELECT count(*) FROM finance_bills WHERE id='partial-new';")" = '0'
          psql -v ON_ERROR_STOP=1 -c "INSERT INTO finance_bills VALUES ('partial-retry','template-partial',DATE '2026-10-20',false);"
      - name: Upload PostgreSQL race diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: postgres-recurring-race
          path: |
            race-a.log
            race-b.log
          if-no-files-found: warn

  postgres-ownership:
    name: PostgreSQL ownership and RLS
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: financeflow
          POSTGRES_PASSWORD: financeflow
          POSTGRES_DB: financeflow_owner_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U financeflow -d financeflow_owner_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: financeflow
      PGPASSWORD: financeflow
      PGDATABASE: financeflow_owner_test
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Create Supabase-compatible ownership fixture
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE authenticated NOLOGIN;
          CREATE SCHEMA auth;
          CREATE TABLE auth.users (id uuid PRIMARY KEY);
          CREATE FUNCTION auth.uid() RETURNS uuid
          LANGUAGE sql STABLE
          AS $$ SELECT NULLIF(current_setting('request.jwt.claim.sub', true), '')::uuid $$;
          CREATE TABLE finance_bills (id uuid DEFAULT gen_random_uuid() PRIMARY KEY, description text, owner_id uuid);
          CREATE TABLE finance_incomes (id uuid DEFAULT gen_random_uuid() PRIMARY KEY, title text, owner_id uuid);
          CREATE TABLE finance_user_settings (id uuid DEFAULT gen_random_uuid() PRIMARY KEY, initial_balance numeric DEFAULT 0, owner_id uuid);
          INSERT INTO auth.users(id) VALUES ('11111111-1111-1111-1111-111111111111'),('22222222-2222-2222-2222-222222222222');
          INSERT INTO finance_bills(description) VALUES ('legacy row');
          SQL
      - name: Apply ownership RLS migration
        run: psql -v ON_ERROR_STOP=1 -f backend/migrations/003_user_ownership_rls.sql
      - name: Historical row stays unowned and invisible
        run: |
          test "$(psql -Atc "SELECT owner_id IS NULL FROM finance_bills WHERE description='legacy row';")" = 't'
          visible=$(psql -Atq <<'SQL'
          SELECT set_config('request.jwt.claim.sub','11111111-1111-1111-1111-111111111111',false);
          SET ROLE authenticated;
          SELECT count(*) FROM finance_bills WHERE description='legacy row';
          RESET ROLE;
          SQL
          )
          test "$(printf '%s\n' "$visible" | tail -n1)" = '0'
      - name: Enforce-not-null migration fails closed before reconciliation
        run: |
          if psql -v ON_ERROR_STOP=1 -f backend/migrations/004_enforce_owner_not_null.sql; then exit 1; fi
          test "$(psql -Atc "SELECT count(*) FROM finance_bills WHERE description='legacy row';")" = '1'
      - name: Reconcile historical row explicitly and enforce ownership
        run: |
          psql -v ON_ERROR_STOP=1 -c "UPDATE finance_bills SET owner_id='11111111-1111-1111-1111-111111111111' WHERE description='legacy row';"
          psql -v ON_ERROR_STOP=1 -f backend/migrations/004_enforce_owner_not_null.sql
          test "$(psql -Atc "SELECT is_nullable FROM information_schema.columns WHERE table_name='finance_bills' AND column_name='owner_id';")" = 'NO'
      - name: Cross-user reads and writes are blocked
        run: |
          test "$(psql -Atq <<'SQL'
          SELECT set_config('request.jwt.claim.sub','22222222-2222-2222-2222-222222222222',false);
          SET ROLE authenticated;
          SELECT count(*) FROM finance_bills WHERE description='legacy row';
          UPDATE finance_bills SET description='tampered' WHERE description='legacy row';
          RESET ROLE;
          SQL
          )" = '0'
          test "$(psql -Atc "SELECT description FROM finance_bills WHERE owner_id='11111111-1111-1111-1111-111111111111';")" = 'legacy row'
      - name: Direct forged ownership is rejected
        run: |
          if psql -v ON_ERROR_STOP=1 <<'SQL'
          SELECT set_config('request.jwt.claim.sub','22222222-2222-2222-2222-222222222222',false);
          SET ROLE authenticated;
          INSERT INTO finance_bills(description,owner_id) VALUES ('forged','11111111-1111-1111-1111-111111111111');
          SQL
          then exit 1; fi
          test "$(psql -Atc "SELECT count(*) FROM finance_bills WHERE description='forged';")" = '0'
      - name: Direct self ownership is accepted before final data-plane migration
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          SELECT set_config('request.jwt.claim.sub','22222222-2222-2222-2222-222222222222',false);
          SET ROLE authenticated;
          INSERT INTO finance_bills(description) VALUES ('owned by default');
          RESET ROLE;
          SQL
          test "$(psql -Atc "SELECT owner_id FROM finance_bills WHERE description='owned by default';")" = '22222222-2222-2222-2222-222222222222'
      - name: Anonymous table access is denied
        run: |
          if psql -v ON_ERROR_STOP=1 <<'SQL'
          SET ROLE anon;
          SELECT * FROM finance_bills;
          SQL
          then exit 1; fi

  mobile:
    name: Mobile typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@b87c23819ed28b50602e246c6e814cd8c77e1499 # v6.2.0
        with:
          node-version: '22.13.1'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install mobile dependencies
        run: npm ci --ignore-scripts
      - name: Typecheck mobile
        run: npx tsc --noEmit

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Run Gitleaks over repository history
        uses: gitleaks/gitleaks-action@a9c2a7c5fcebe14b01e16fbb3d27d362feb4e7cf # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'true'

  dependency-audit:
    name: Dependency audit evidence
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Audit backend dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install pip-audit
          python -m pip_audit -r backend/requirements.txt -f json -o pip-audit.json
      - name: Setup Node
        uses: actions/setup-node@b87c23819ed28b50602e246c6e814cd8c77e1499 # v6.2.0
        with:
          node-version: '22.13.1'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install mobile dependencies for audit
        working-directory: mobile
        run: npm ci --ignore-scripts
      - name: Audit mobile dependencies
        id: npm_audit
        shell: bash
        run: |
          set +e
          npm audit --prefix mobile --json > npm-audit.json
          audit_status=$?
          set -e
          node - <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('npm-audit.json', 'utf8'));
          const vulnerabilities = report.metadata?.vulnerabilities ?? {};
          const critical = Number(vulnerabilities.critical ?? 0);
          console.log(`npm audit exit=${process.env.AUDIT_STATUS ?? 'captured'} critical=${critical}`);
          if (critical > 0) process.exit(1);
          NODE
          echo "npm audit exited with ${audit_status}; non-critical findings remain visible in the artifact."
      - name: Upload audit reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependency-audit-reports
          path: |
            pip-audit.json
            npm-audit.json
          if-no-files-found: warn
