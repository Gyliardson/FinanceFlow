name: Final placeholder contrast fix

on:
  push:
    branches:
      - work/199-local-mobile-auth-smoke

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: work/199-local-mobile-auth-smoke
      - name: Apply placeholder contrast
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('mobile/src')
          text_input = re.compile(r'<TextInput\b[\s\S]*?/>')
          placeholder = re.compile(r'\bplaceholder\s*=')
          placeholder_color = re.compile(r'\bplaceholderTextColor\s*=')
          literal_placeholder = re.compile(r'(\bplaceholder\s*=\s*"[^"]*")')
          fixed = [0]

          def patch_tag(match):
              tag = match.group(0)
              if not placeholder.search(tag) or placeholder_color.search(tag):
                  return tag
              updated, count = literal_placeholder.subn(
                  r'\1 placeholderTextColor="#64748b"',
                  tag,
                  count=1,
              )
              if count != 1:
                  raise RuntimeError('TextInput placeholder is not a supported string literal')
              fixed[0] += 1
              return updated

          for path in sorted(root.rglob('*.tsx')):
              source = path.read_text(encoding='utf-8')
              updated = text_input.sub(patch_tag, source)
              if updated != source:
                  path.write_text(updated, encoding='utf-8')

          if fixed[0] != 10:
              raise RuntimeError(f'Expected exactly 10 missing placeholder colors, fixed {fixed[0]}')
          print(f'Fixed {fixed[0]} placeholder fields.')
          PY
      - name: Remove temporary workflow and commit
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/_final-placeholder-fix.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/src
          git commit -m "fix(mobile): make placeholders legible across forms"
          git push origin HEAD:work/199-local-mobile-auth-smoke
