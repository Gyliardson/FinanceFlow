name: Remediate mobile lock once

on:
  push:
    branches:
      - work/5-expo57-dependency-baseline
    paths:
      - .github/workflows/remediate-mobile-lock.yml

permissions:
  contents: write

jobs:
  remediate:
    if: github.ref == 'refs/heads/work/5-expo57-dependency-baseline'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout exact work branch
        uses: actions/checkout@v6
        with:
          ref: work/5-expo57-dependency-baseline
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Apply only non-breaking npm audit fixes to lockfile
        shell: bash
        run: |
          set -euo pipefail
          npm audit fix --package-lock-only --ignore-scripts || status=$?
          if [ "${status:-0}" -ne 0 ] && [ "${status:-0}" -ne 1 ]; then
            exit "$status"
          fi

      - name: Validate remediated lock with clean install
        run: npm ci --ignore-scripts

      - name: Capture final audit and require zero critical findings
        shell: bash
        run: |
          npm audit --json > "$RUNNER_TEMP/mobile-audit.json" || true
          node - "$RUNNER_TEMP/mobile-audit.json" <<'NODE'
          const fs = require('fs');
          const audit = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const counts = audit.metadata?.vulnerabilities || {};
          console.log(`MOBILE_AUDIT_COUNTS=${JSON.stringify(counts)}`);
          if ((counts.critical || 0) > 0) {
            console.error('Critical mobile dependency findings remain after bounded remediation.');
            process.exit(1);
          }
          NODE

      - name: Commit lockfile and remove one-shot workflow
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/remediate-mobile-lock.yml
          git add mobile/package-lock.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "deps(mobile): apply bounded audit remediation [skip ci]"
          git pull --rebase origin work/5-expo57-dependency-baseline
          git push origin HEAD:work/5-expo57-dependency-baseline
