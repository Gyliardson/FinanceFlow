name: Mobile Expo health

on:
  workflow_dispatch:
  pull_request:
    branches:
      - portfolio/revamp-2026
      - main
  push:
    branches:
      - portfolio/revamp-2026
      - 'work/**'

permissions:
  contents: read

jobs:
  expo-health:
    name: Expo Doctor and build smoke
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.13.0'
          cache: npm
          cache-dependency-path: |
            mobile/package-lock.json
            .github/npm-tools/package-lock.json
      - name: Clean install mobile closure
        run: npm ci --ignore-scripts
      - name: Install integrity-locked release tooling
        working-directory: .
        run: npm ci --ignore-scripts --legacy-peer-deps --prefix .github/npm-tools
      - name: TypeScript
        run: ./node_modules/.bin/tsc --noEmit
      - name: Validate production branding assets
        run: node scripts/test-branding-assets-contract.mjs
      - name: Expo Doctor
        run: ../.github/npm-tools/node_modules/.bin/expo-doctor
      - name: Validate mobile release environment contract
        run: node scripts/test-release-env-contract.mjs
      - name: Validate public Expo config
        run: ./node_modules/.bin/expo config --type public > /tmp/expo-public-config.txt
      - name: Web export smoke
        run: ./node_modules/.bin/expo export --platform web --output-dir dist-ci
