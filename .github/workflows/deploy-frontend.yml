name: "FinanceFlow Deploy"

on:
  push:
    branches:
      - main
    paths:
      - 'mobile/**'

permissions:
  contents: read

jobs:
  update-frontend:
    name: Expo EAS Update (Frontend)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.13.0
          cache: 'npm'
          cache-dependency-path: 'mobile/package-lock.json'

      - name: Install dependencies
        working-directory: ./mobile
        run: npm ci

      - name: Setup EAS
        uses: expo/expo-github-action@eab7a230208c952974db8c3245cfd78402c7b385 # 9.0.0
        with:
          eas-version: 21.8.0
          packager: npm
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Validate production runtime configuration
        working-directory: ./mobile
        run: eas env:exec production 'node scripts/validate-release-env.mjs' --non-interactive

      - name: Publish Update
        working-directory: ./mobile
        run: eas update --branch production --environment production --message "Auto-deploy via GitHub Actions"
