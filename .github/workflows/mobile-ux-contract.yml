name: Mobile UX contract

on:
  pull_request:
    branches:
      - portfolio/revamp-2026
      - main
  push:
    branches:
      - portfolio/revamp-2026
      - 'work/**'

permissions:
  contents: read

jobs:
  ux-accessibility-contract:
    name: UX state and accessibility contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22.13.0'
      - name: Run focused mobile contract
        run: node mobile/tests/ux-accessibility-contract.cjs
