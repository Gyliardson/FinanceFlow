name: Backend container

on:
  workflow_dispatch:
  pull_request:
    branches:
      - portfolio/revamp-2026
      - main
    paths:
      - 'backend/**'
      - 'render.yaml'
      - '.github/workflows/backend-container.yml'
  push:
    branches:
      - portfolio/revamp-2026
      - 'work/**'
    paths:
      - 'backend/**'
      - 'render.yaml'
      - '.github/workflows/backend-container.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build production backend image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build backend image
        run: docker build --tag financeflow-backend:ci backend
      - name: Verify production Python runtime
        run: |
          runtime_python=$(docker run --rm --entrypoint python financeflow-backend:ci -c \
            'import sys; print(f"{sys.version_info.major}.{sys.version_info.minor}")')
          echo "Production image Python: $runtime_python"
          test "$runtime_python" = '3.12'
      - name: Verify production entrypoint
        run: |
          entrypoint=$(docker inspect --format '{{json .Config.Cmd}}' financeflow-backend:ci)
          echo "$entrypoint"
          echo "$entrypoint" | grep -F 'runtime:create_app'
          echo "$entrypoint" | grep -F -- '--factory'
      - name: Verify unprivileged runtime identity
        run: |
          configured_user=$(docker inspect --format '{{.Config.User}}' financeflow-backend:ci)
          test "$configured_user" = 'financeflow'
          docker run --rm --entrypoint sh financeflow-backend:ci -c \
            'test "$(id -u)" -ne 0 && test "$(id -un)" = financeflow'
